<!DOCTYPE html>
<html lang="ru" data-vs-theme="dark">
<head>
<meta charset="UTF-8">
<title>RuTube — store screenshot host</title>
<style>
  /* Host-page styles ONLY. The extension's content script injects its
     own .vs-panel + .settings-menu at runtime. */
  html, body {
    margin: 0;
    padding: 0;
    background: #0e0c14;
    color: rgba(255, 255, 255, 0.92);
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .rt-masthead {
    height: 56px;
    background: linear-gradient(180deg, #1a1226 0%, #0e0c14 100%);
    display: flex; align-items: center; gap: 24px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .rt-logo {
    font-weight: 800; font-size: 22px;
    background: linear-gradient(90deg, #00d8ff 0%, #b46cff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; letter-spacing: -0.5px;
  }
  .rt-search {
    flex: 0 1 540px; height: 36px; margin: 0 auto;
    background: #1d1729; border: 1px solid rgba(180, 108, 255, 0.18);
    border-radius: 18px;
    display: flex; align-items: center; padding: 0 16px;
    color: rgba(255, 255, 255, 0.5); font-size: 14px;
  }

  #primary { max-width: 1080px; margin: 0 auto; padding: 16px; }
  .video-page-layout-module__player {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(180, 108, 255, 0.18), transparent 55%),
      radial-gradient(ellipse at 75% 70%, rgba(0, 216, 255, 0.14), transparent 55%),
      linear-gradient(160deg, #1a1226 0%, #0a0810 100%);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  .video-page-layout-module__player video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: transparent; pointer-events: none;
  }
  .rt-play-btn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #00d8ff 0%, #b46cff 100%);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(180, 108, 255, 0.45);
    z-index: 1;
  }
  .rt-play-btn::after {
    content: ''; width: 0; height: 0;
    border-left: 22px solid #fff;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    margin-left: 5px;
  }
  .desktop-controls-layout-module__wrapper {
    position: relative;
    background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
    padding: 12px 16px 10px;
    display: flex; align-items: center; gap: 12px;
    color: rgba(255, 255, 255, 0.85); font-size: 12px; z-index: 1;
  }
  .rt-progress {
    flex: 1; height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px; overflow: hidden;
  }
  .rt-progress::after {
    content: ''; display: block; width: 30%; height: 100%;
    background: linear-gradient(90deg, #00d8ff 0%, #b46cff 100%);
  }

  /* Title section — anchor for the panel injection (matches the
     `[class*="videoTitleSection"]` selector in selectors.ts). */
  .videoTitleSection { margin-top: 16px; }
  .rt-title {
    font-size: 20px; font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.3; margin: 0;
  }
  .rt-meta {
    margin-top: 4px;
    font-size: 14px; color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
<div class="rt-masthead">
  <div class="rt-logo">RUTUBE</div>
  <div class="rt-search">Поиск</div>
</div>

<div id="primary">
  <section class="video-page-layout-module__player video-player">
    <video preload="none" muted></video>
    <div class="rt-play-btn"></div>
    <div class="desktop-controls-layout-module__wrapper">
      <div class="rt-progress"></div>
      <span style="font-variant-numeric:tabular-nums">14:08 / 1:42:30</span>
    </div>
  </section>
  <div class="videoTitleSection">
    <h1 class="rt-title">Документальный фильм: как кодить в 2026 году</h1>
    <div class="rt-meta">328 459 просмотров · 5 дней назад · Канал · Технологии</div>
  </div>
</div>
</body>
</html>
