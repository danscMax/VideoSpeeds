<!DOCTYPE html>
<html lang="en" data-vs-theme="dark">
<head>
<meta charset="UTF-8">
<title>YouTube — store screenshot host</title>
<style>
  /* Host-page styles ONLY. The extension's content script injects its
     own .vs-panel + .settings-menu + their CSS at runtime — render.mjs
     intercepts requests for this mock and serves it under the
     youtube.com/watch?v=… path so the content_script bootstrap fires. */
  html, body {
    margin: 0;
    padding: 0;
    background: #0f0f0f;
    color: rgba(255, 255, 255, 0.92);
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .yt-masthead {
    height: 56px; background: #0f0f0f; display: flex; align-items: center;
    padding: 0 16px; gap: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .yt-logo-row {
    display: flex; align-items: center; gap: 4px;
    font-weight: 600; font-size: 18px; letter-spacing: -0.5px;
  }
  .yt-logo {
    width: 28px; height: 28px; background: #ff0000;
    border-radius: 50%; position: relative;
  }
  .yt-logo::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 0; height: 0;
    border-left: 9px solid #fff;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .yt-search {
    flex: 0 1 540px; height: 36px; margin: 0 auto;
    background: #121212; border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 18px; display: flex; align-items: center;
    padding: 0 16px; color: rgba(255, 255, 255, 0.5); font-size: 14px;
  }
  .yt-actions {
    margin-left: auto; display: flex; gap: 12px;
    color: rgba(255, 255, 255, 0.7); font-size: 13px;
  }

  #primary { max-width: 1080px; margin: 0 auto; padding: 16px; }
  .yt-player {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse at 35% 40%, rgba(180, 30, 30, 0.18), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(60, 60, 60, 0.20), transparent 55%),
      linear-gradient(160deg, #1a0808 0%, #0a0606 100%);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  .yt-player video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: transparent; pointer-events: none;
  }
  .yt-play-btn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 76px; height: 76px;
    background: rgba(255, 0, 0, 0.85); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(255, 0, 0, 0.4); z-index: 1;
  }
  .yt-play-btn::after {
    content: ''; width: 0; height: 0;
    border-left: 22px solid #fff;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    margin-left: 5px;
  }
  .ytp-controls {
    position: relative;
    background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
    padding: 12px 16px 10px;
    display: flex; align-items: center; gap: 12px;
    color: rgba(255, 255, 255, 0.85); font-size: 12px; z-index: 1;
  }
  .ytp-progress {
    flex: 1; height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px; overflow: hidden;
  }
  .ytp-progress::after {
    content: ''; display: block; width: 35%; height: 100%; background: #ff0000;
  }

  /* Title block — anchor for the panel injection (`ytd-watch-metadata`
     is the primary infoElem in src/discovery/selectors.ts). */
  ytd-watch-metadata { display: block; margin-top: 16px; }
  .yt-title {
    font-size: 20px; font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.3;
  }
  .yt-meta {
    margin-top: 4px;
    font-size: 14px; color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
<div class="yt-masthead">
  <div class="yt-logo-row">
    <span class="yt-logo"></span>
    YouTube
  </div>
  <div class="yt-search">Search</div>
  <div class="yt-actions"><span>Sign in</span></div>
</div>

<div id="primary">
  <div id="movie_player" class="yt-player">
    <video preload="none" muted></video>
    <div class="yt-play-btn"></div>
    <div class="ytp-controls">
      <div class="ytp-progress"></div>
      <span style="font-variant-numeric:tabular-nums">12:34 / 38:42</span>
    </div>
  </div>
  <ytd-watch-metadata>
    <div id="top-row">
      <div class="yt-title">How playback speed control turns long videos into 30-minute briefings</div>
      <div class="yt-meta">142,857 views · 3 days ago · Channel · Productivity</div>
    </div>
  </ytd-watch-metadata>
</div>
</body>
</html>
