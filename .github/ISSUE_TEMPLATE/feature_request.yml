name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: a feature this extension intentionally does NOT have
        is just as important as one it does. Keep it focused on user value.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation in which today's UX falls short.
      placeholder: |
        I want different default speeds per host — 1.5x for YouTube
        lectures and 1.0x for RuTube music videos — without flipping
        the slider every time I switch tabs.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: |
        Per-host preset slot in Settings. Falls back to the global
        default when no per-host value is set.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: |
        - Just remembering to set it manually.
        - A "boost" hotkey that overrides per-session.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - YouTube only
        - RuTube only
        - Both YouTube and RuTube
        - Should also exist in the HDRezka sibling (HDRezkaSpeeds)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I checked existing issues for duplicates.
          required: false
        - label: I'm willing to test a beta build of this feature.
          required: false
